name: Compila e pubblica MhxrPatcher

# Gira sui server di GitHub, non sul PC di chi lavora al codice: a ogni
# aggiornamento di main produce un .exe pronto e lo mette in una release
# "latest" sempre aggiornata, cosi' chi scarica il programma non deve
# saper compilare ne' installare Visual Studio.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pubblica (self-contained, file singolo)
        run: >
          dotnet publish MhxrPatcher.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -o publish

      - name: Pubblica la release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MhxrPatcher (ultima build)
          body: >
            Automatic build of the latest commit on main. Download the original
            Japanese APK yourself (see INSTRUCTIONS.txt), then run MhxrPatcher.exe:
            it points the game to the private server. Only the Java JDK is needed.
          files: publish/MhxrPatcher.exe
          prerelease: false

  # Versione per telefono: un APK che fa tutto da solo (patch, manifest, firma, installazione).
  # Viene dopo la build dell'exe per non creare la release "latest" due volte insieme.
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila l'APK del patcher
        run: gradle -p android assembleRelease --no-daemon

      - name: Rinomina
        run: cp android/app/build/outputs/apk/release/app-release.apk MhxrPatcher.apk

      - name: Aggiunge l'APK alla release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: MhxrPatcher.apk
          prerelease: false

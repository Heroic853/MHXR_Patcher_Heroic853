# Progetto iOS del patcher, generato da XcodeGen sul Mac di GitHub Actions (.github/workflows/ios.yml):
# nessun Mac serve a chi lavora al codice. L'app esce SENZA firma: si installa con TrollStore, AltStore,
# SideStore o Sideloadly, che la firmano con l'Apple ID di chi la usa.
name: MhxrPatcher
options:
  deploymentTarget:
    iOS: "15.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19
targets:
  MhxrPatcher:
    type: application
    platform: iOS
    sources: [MhxrPatcher]
    dependencies:
      - package: ZIPFoundation
    info:
      path: MhxrPatcher/Info.plist
      properties:
        CFBundleDisplayName: MHXR Patcher
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.itunes.ipa]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [ipa]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mhxr.patcher.ios
        PRODUCT_NAME: MhxrPatcher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
